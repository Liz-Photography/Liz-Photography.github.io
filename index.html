<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liz Photography</title>
<meta name="description" content="Professional photography portfolio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
  <div class="container">
    <a href="#" class="logo">Elizabeth</a>
    <nav>
      <a href="#work">Work</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1>Elizabeth</h1>
    <p>Photography &mdash; Portraits &amp; Stories in Light</p>
  </div>
  <div class="scroll-cue">Scroll</div>
</section>

<section class="gallery-section" id="work">
  <div class="container">
    <div class="section-heading">
      <span class="eyebrow">Selected Work</span>
      <h2>The Portfolio</h2>
    </div>
    <div class="grid" id="gallery">
      <!-- photos injected by js/site.js -->
    </div>
  </div>
</section>

<footer id="contact">
  <div class="container">
    &copy; <span id="year"></span> Liz Photography. All rights reserved.
  </div>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
  <button class="lightbox-prev" id="lbPrev" aria-label="Previous">&#8249;</button>
  <button class="lightbox-next" id="lbNext" aria-label="Next">&#8250;</button>
  <div class="lightbox-inner">
    <img id="lbImage" src="" alt="">
    <div class="lightbox-caption">
      <h3 id="lbTitle"></h3>
      <p id="lbDesc"></p>
    </div>
  </div>
</div>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
<script src="/js/site.js"></script>
</body>
</html>
